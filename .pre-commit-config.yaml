repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: sync-progress
        name: sync README progress table
        entry: python scripts/sync_progress.py
        language: system
        files: ^(README\.md|CHANGELOG\.md|docs/spec/.*\.md)$
        pass_filenames: false
