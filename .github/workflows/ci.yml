name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Complexity guard
        run: uv run python scripts/complexity_guard.py
      - name: Progress table up to date
        run: uv run python scripts/sync_progress.py --check
      - name: Public API surface frozen
        run: uv run python scripts/public_api.py --check
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/scw
      - name: Test
        run: uv run pytest --cov=scw --cov-report=term-missing
