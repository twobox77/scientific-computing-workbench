name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          module="$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/scw/__init__.py').read()).group(1))")"
          echo "tag=$tag pyproject=$project module=$module"
          if [ "$tag" != "$project" ] || [ "$tag" != "$module" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject ($project) / __version__ ($module)"
            exit 1
          fi
      - name: Build wheel and sdist
        run: uv build
      - name: Show artifacts
        run: ls -l dist
      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          # Prefer the generated notes (English changelog + the shared Chinese
          # guide + the works added by this release); fall back to GitHub's
          # generated notes for old tags that predate the generator.
          if python3 scripts/make_release_notes.py "$GITHUB_REF_NAME" -o notes.md; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          else
            echo "release-notes generator unavailable; using generated notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
      - name: Upload wheel and sdist to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
